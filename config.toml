# ------------------------------------------------------------------
# lizard configuration
#
# Every value here can be overridden on the command line, e.g.:
#   lizard --config other.toml --port 9000 --log-level debug
# ------------------------------------------------------------------

[server]
host = "127.0.0.1"
port = 8080

[logging]
# tracing filter: trace | debug | info | warn | error
# (also accepts full directives like "info,access=debug")
level = "info"
# Per-request access log file. Comment out (or pass --no-access-log)
# to disable the file; requests are still logged to the console.
access_log = "access.log"

[ui]
# This whole section is served to the SPA via GET /api/config.
app_name = "Lizard"
tagline = "ACME server with a built-in private CA"
# Theme the UI uses until the visitor picks one: light | dark | auto
default_theme = "auto"
repo_url = "https://github.com/prasenjit-net/lizard"

[ca]
# Generated on first run if these don't exist yet — see the README for
# what to do with the root cert once it's there.
root_cert_path = "data/ca/root-cert.pem"
root_key_path = "data/ca/root-key.pem"
root_validity_years = 10
# How long each certificate this server issues stays valid for.
cert_validity_days = 90
db_path = "data/lizard.db"
