[package]
name = "lizard"
version = "0.1.0"
edition = "2021"
description = "ACME server that issues SSL/TLS certificates from its own private CA"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = "8"
mime_guess = "2"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rcgen = { version = "0.14.9", features = ["x509-parser"] }
time = "0.3"
rustls-pki-types = "1.15.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ring = "0.17.14"
base64 = "0.23.1"
uuid = { version = "1.25.0", features = ["v4"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3.27.0"
pem = "4.0.0"
x509-parser = { version = "0.18.1", features = ["verify"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
